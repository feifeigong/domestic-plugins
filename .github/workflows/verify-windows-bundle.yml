name: Verify bundled Windows runtimes
on:
  push:
    branches: ['stage/windows-runtime-025']
permissions:
  contents: read
jobs:
  amd64:
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      bundle_sha: ${{ steps.bundle.outputs.bundle_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and verify both pinned Python archives
        run: ./scripts/vendor-windows-runtime.ps1
      - name: Test AMD64 with system Python excluded
        run: |
          $python = './plugins/china-email/runtime/windows/amd64/python.exe'
          & $python ./scripts/verify-windows-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s ./plugins/china-email/tests
      - name: Attach tested bundle to the staging branch
        id: bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force -- plugins/china-email/runtime/windows
          git commit -m 'Stage verified CPython Windows runtimes'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "bundle_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
  arm64:
    needs: amd64
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.amd64.outputs.bundle_sha }}
          persist-credentials: false
      - name: Test native ARM64 with system Python excluded
        run: |
          $python = './plugins/china-email/runtime/windows/arm64/python.exe'
          & $python ./scripts/verify-windows-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s ./plugins/china-email/tests
